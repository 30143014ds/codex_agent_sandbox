services:
  codex_agent_sandbox:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: codex_agent_sandbox
    privileged: true
    volumes:
      - ./workspace:/workspace
      # Конфиг Codex CLI (аналогичная структура, свой домашний каталог)
      - ./codex-config:/home/agent/.codex
      - codex-docker-data:/var/lib/docker
      - ssh-data:/home/agent/.ssh
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
      - "0.0.0.0:8080:8080"
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - agent-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G

networks:
  agent-net:
    driver: bridge

volumes:
  codex-docker-data:
  ssh-data: