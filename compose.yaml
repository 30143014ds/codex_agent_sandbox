services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: codex-agent-${AGENT_TYPE:-base}:local
    environment:
      AGENT_INSTANCE: ${AGENT_INSTANCE:?Set AGENT_INSTANCE in the instance env file}
      AGENT_TYPE: ${AGENT_TYPE:?Set AGENT_TYPE in the instance env file}
      CODEX_HOME: /home/agent/.codex
    volumes:
      - type: bind
        source: ${INSTANCE_HOME_PATH:?Set INSTANCE_HOME_PATH in the instance env file}
        target: /home/agent
      - type: bind
        source: ${WORKSPACE_PATH:?Set WORKSPACE_PATH in the instance env file}
        target: /workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks: [agent-net]

networks:
  agent-net:
    driver: bridge
