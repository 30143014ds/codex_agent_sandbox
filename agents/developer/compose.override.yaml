services:
  agent:
    build:
      target: developer
    privileged: true
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: volume
        source: docker-data
        target: /var/lib/docker
    tmpfs:
      - /run
    stop_grace_period: 60s
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_HTTP_PORT:-18080}:80"
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_HTTPS_PORT:-18443}:443"
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_ADMINER_PORT:-18081}:8080"
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_APP_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  docker-data:
